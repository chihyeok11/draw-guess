<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>캐치마인드 - Draw & Guess</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* 메인 컨테이너 */
        #app {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 로비 화면 */
        #lobbyScreen {
            padding: 40px 20px;
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }

        #lobbyScreen h1 {
            font-size: 28px;
            margin-bottom: 24px;
            color: #333;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: #4A90E2;
            color: white;
        }

        .btn-primary:hover {
            background-color: #357ABD;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #d0d0d0;
        }

        /* 게임 화면 메인 레이아웃 */
        #gameScreen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 상단 헤더 (방 정보, 제시어, 타이머) */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #eee;
        }

        .room-info {
            font-weight: bold;
            color: #555;
        }

        .word-hint {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            letter-spacing: 2px;
        }

        .timer {
            font-size: 20px;
            font-weight: bold;
            color: #e74c3c;
            min-width: 50px;
            text-align: right;
        }

        /* 본문 구조 (플레이어 - 캔버스 - 채팅) */
        .game-body {
            display: flex;
            flex: 1;
            padding: 16px;
            gap: 16px;
        }

        /* 왼쪽: 플레이어 리스트 */
        .players-container {
            width: 180px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-card {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid transparent;
        }

        .player-card.drawing {
            border-color: #4A90E2;
            background-color: #eef6ff;
        }

        .player-name {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .player-score {
            font-size: 12px;
            color: #27ae60;
            font-weight: bold;
        }

        /* 중앙: 캔버스 및 툴바 */
        .canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 480px;
            background-color: #ffffff;
            border: 2px solid #ddd;
            border-radius: 8px;
            touch-action: none;
            cursor: crosshair;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
            width: 100%;
            justify-content: center;
        }

        .toolbar.hidden {
            display: none !important;
        }

        .color-picker {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 오른쪽: 넓어진 채팅 영역 */
        .chat-section {
            width: 320px; /* 기존보다 확장된 너비 */
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .chat-messages {
            height: 420px; /* 기존보다 확장된 높이 */
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            word-break: break-all;
        }

        .msg {
            font-size: 14px;
            line-height: 1.4;
        }

        .msg.system {
            color: #7f8c8d;
            font-size: 12px;
            text-align: center;
            background-color: #f1f3f5;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .msg .sender {
            font-weight: bold;
            margin-right: 4px;
        }

        .chat-input-form {
            display: flex;
            padding: 8px;
            background-color: #f8f9fa;
            border-top: 1px solid #ddd;
        }

        .chat-input-form input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        .chat-input-form button {
            margin-left: 6px;
            padding: 8px 12px;
            flex: none;
        }

        /* 유틸리티 */
        .hidden {
            display: none !important;
        }

        /* 모바일 대응 레이아웃 */
        @media (max-width: 768px) {
            .game-body {
                flex-direction: column;
            }
            .players-container, .chat-section {
                width: 100%;
            }
            canvas {
                height: 320px;
            }
            .chat-messages {
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- 1. 로비 화면 -->
        <div id="lobbyScreen">
            <h1>🎨 캐치마인드</h1>
            <div class="input-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" placeholder="닉네임을 입력하세요" maxlength="10">
            </div>
            <div class="input-group">
                <label for="roomCodeInput">방 코드 (참가 시 입력)</label>
                <input type="text" id="roomCodeInput" placeholder="방 코드 6자리" style="text-transform: uppercase;">
            </div>
            <div class="btn-group">
                <button class="btn-primary" id="btnCreate">방 만들기</button>
                <button class="btn-secondary" id="btnJoin">참가하기</button>
            </div>
        </div>

        <!-- 2. 게임 화면 -->
        <div id="gameScreen" class="hidden">
            <div class="game-header">
                <div class="room-info">방 코드: <span id="displayRoomCode">-</span></div>
                <div class="word-hint" id="wordDisplay">대기 중...</div>
                <div class="timer" id="timerDisplay">60초</div>
            </div>

            <div class="game-body">
                <!-- 플레이어 목록 -->
                <div class="players-container" id="playerList"></div>

                <!-- 캔버스 영역 -->
                <div class="canvas-container">
                    <canvas id="canvas" width="600" height="480"></canvas>
                    
                    <div class="toolbar" id="toolbar">
                        <input type="color" id="colorPicker" class="color-picker" value="#000000">
                        <input type="range" id="lineWidth" min="1" max="20" value="5">
                        <button class="btn-secondary" id="btnClear">지우기</button>
                    </div>
                    
                    <button class="btn-primary" id="btnStart" style="margin-top: 10px; width: 100%;">게임 시작</button>
                </div>

                <!-- 확장된 채팅창 영역 -->
                <div class="chat-section">
                    <div class="chat-messages" id="chatMessages"></div>
                    <form class="chat-input-form" id="chatForm">
                        <input type="text" id="chatInput" placeholder="정답 또는 채팅 입력..." autocomplete="off">
                        <button type="submit" class="btn-primary">전송</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // DOM 요소
        const lobbyScreen = document.getElementById('lobbyScreen');
        const gameScreen = document.getElementById('gameScreen');
        const nicknameInput = document.getElementById('nickname');
        const roomCodeInput = document.getElementById('roomCodeInput');
        const btnCreate = document.getElementById('btnCreate');
        const btnJoin = document.getElementById('btnJoin');
        const displayRoomCode = document.getElementById('displayRoomCode');
        const wordDisplay = document.getElementById('wordDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        const playerList = document.getElementById('playerList');
        const btnStart = document.getElementById('btnStart');
        const toolbar = document.getElementById('toolbar');

        // 캔버스 요소
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const lineWidth = document.getElementById('lineWidth');
        const btnClear = document.getElementById('btnClear');

        // 채팅 요소
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');

        // 상태 변수
        let isMyTurn = false;
        let isDrawing = false;
        let isGameStarted = false;

        // 방 생성 / 참가
        btnCreate.addEventListener('click', () => {
            const nick = nicknameInput.value.trim();
            if (!nick) return alert('닉네임을 입력하세요.');
            socket.emit('createRoom', { userNick: nick });
        });

        btnJoin.addEventListener('click', () => {
            const nick = nicknameInput.value.trim();
            const code = roomCodeInput.value.trim();
            if (!nick) return alert('닉네임을 입력하세요.');
            if (!code) return alert('방 코드를 입력하세요.');
            socket.emit('joinRoom', { roomCode: code, userNick: nick });
        });

        socket.on('joinSuccess', ({ roomCode, isHost }) => {
            lobbyScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            displayRoomCode.textContent = roomCode;
            toolbar.classList.add('hidden');
            if (!isHost) btnStart.classList.add('hidden');
        });

        socket.on('errorMessage', (msg) => alert(msg));

        // 플레이어 목록 갱신
        socket.on('updatePlayers', ({ players, hostId }) => {
            playerList.innerHTML = '';
            players.forEach(p => {
                const card = document.createElement('div');
                card.className = `player-card ${p.isDrawing ? 'drawing' : ''}`;
                card.innerHTML = `
                    <span class="player-name">${p.nickname} ${p.id === hostId ? '👑' : ''}</span>
                    <span class="player-score">${p.score}pt</span>
                `;
                playerList.appendChild(card);
            });

            if (socket.id === hostId && !isGameStarted) {
                btnStart.classList.remove('hidden');
            } else {
                btnStart.classList.add('hidden');
            }
        });

        // 게임 시작 및 턴 제어
        btnStart.addEventListener('click', () => socket.emit('startGame'));

        socket.on('turnStart', ({ drawerId, hintMask }) => {
            isGameStarted = true;
            btnStart.classList.add('hidden');
            isMyTurn = (socket.id === drawerId);

            wordDisplay.textContent = hintMask;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isMyTurn) {
                toolbar.classList.remove('hidden');
            } else {
                toolbar.classList.add('hidden');
            }
        });

        socket.on('yourWord', (word) => {
            if (isMyTurn) wordDisplay.textContent = `제시어: ${word}`;
        });

        socket.on('timerUpdate', (time) => {
            timerDisplay.textContent = `${time}초`;
        });

        // 캔버스 그리기 이벤트
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            if (!isMyTurn) return;
            isDrawing = true;
            const pos = getCanvasCoords(e);
            draw(pos.x, pos.y, false);
            socket.emit('draw', { x: pos.x, y: pos.y, isDrawing: false, color: colorPicker.value, width: lineWidth.value });
        }

        function drawMove(e) {
            if (!isMyTurn || !isDrawing) return;
            const pos = getCanvasCoords(e);
            draw(pos.x, pos.y, true);
            socket.emit('draw', { x: pos.x, y: pos.y, isDrawing: true, color: colorPicker.value, width: lineWidth.value });
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(x, y, isDragging, color = colorPicker.value, width = lineWidth.value) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (!isDragging) {
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', drawMove);
        canvas.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { startDrawing(e); e.preventDefault(); });
        canvas.addEventListener('touchmove', (e) => { drawMove(e); e.preventDefault(); });
        canvas.addEventListener('touchend', stopDrawing);

        socket.on('draw', (data) => {
            draw(data.x, data.y, data.isDrawing, data.color, data.width);
        });

        btnClear.addEventListener('click', () => {
            if (!isMyTurn) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            socket.emit('clearCanvas');
        });

        socket.on('clearCanvas', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // 채팅 및 정답
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = chatInput.value.trim();
            if (msg) {
                socket.emit('sendMessage', msg);
                chatInput.value = '';
            }
        });

        socket.on('chatMessage', (data) => {
            const div = document.createElement('div');
            if (data.system) {
                div.className = 'msg system';
                div.textContent = data.text;
            } else {
                div.className = 'msg';
                div.innerHTML = `<span class="sender">${data.nickname}:</span> ${data.text}`;
            }
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        socket.on('correctAnswer', ({ winnerNick, word, score }) => {
            const div = document.createElement('div');
            div.className = 'msg system';
            div.style.backgroundColor = '#e8f8f5';
            div.style.color = '#27ae60';
            div.style.fontWeight = 'bold';
            div.textContent = `🎉 [${winnerNick}]님이 정답 [${word}]을(를) 맞혀서 +${score}pt를 획득하셨습니다!`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });
    </script>
</body>
</html>
