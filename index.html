<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>draw.guess - 캐치마인드</title>
    <!-- 구글 폰트 적용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body { 
            background-color: #f7f4ed; 
            background-image: radial-gradient(#e2ded4 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            color: #1a1a2e;
            padding: 10px;
        }

        #app { 
            width: 100%;
            max-width: 1000px; 
            height: 90vh;
            max-height: 720px;
            background: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.06); 
            position: relative; 
            overflow: hidden; 
            border: 1px solid #eae5d9;
            display: flex;
            flex-direction: column;
        }

        .screen { display: none; width: 100%; height: 100%; }
        .screen.active { display: flex; flex-direction: column; }

        /* 로비 화면 */
        #lobby-screen { 
            background-color: #f8f6f0;
            background-image: radial-gradient(#e3decb 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            overflow-y: auto;
            padding: 24px 16px;
            align-items: center;
            justify-content: center;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Syne', sans-serif;
            font-size: clamp(18px, 4vw, 22px);
            font-weight: 800;
            color: #1a1a2e;
            margin-bottom: 12px;
        }
        .brand-icon {
            width: 30px;
            height: 30px;
            background: #39a084;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .badge {
            background: #f77f5d;
            color: white;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .hero-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(28px, 6vw, 42px);
            line-height: 1.1;
            font-weight: 800;
            text-align: center;
            color: #1c1c28;
            margin-bottom: 12px;
        }
        .hero-title .highlight { color: #39a084; display: block; }

        .hero-desc {
            font-size: clamp(12px, 3vw, 13px);
            color: #6c727f;
            text-align: center;
            max-width: 400px;
            line-height: 1.4;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .tag-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .info-tag {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e1dbc9;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #555;
            font-weight: 600;
        }

        .lobby-card {
            background: #ffffff;
            border-radius: 16px;
            width: 100%;
            max-width: 340px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            border: 1px solid #e8e3d5;
        }

        .tab-group {
            display: flex;
            background: #f0ece1;
            padding: 3px;
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            font-size: 12px;
            font-weight: 700;
            color: #7a766c;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active { background: #ffffff; color: #1a1a2e; }

        .form-label { font-size: 11px; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; display: block; }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: #f6f3eb;
            border: 1px solid transparent;
            border-radius: 10px;
            outline: none;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .form-input:focus { border-color: #39a084; background: #fff; }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #39a084;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 게임 화면 헤더 */
        #game-screen { position: relative; width: 100%; height: 100%; }

        header { 
            height: 50px; 
            background: #fff; 
            border-bottom: 1px solid #ebe6d9; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 16px; 
            flex-shrink: 0;
            gap: 8px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .room-info { font-weight: 700; font-size: 13px; color: #555; }
        .room-info span { color: #39a084; font-weight: 800; }
        .word-box { font-size: 15px; font-weight: 800; color: #f77f5d; background: #fff1ed; padding: 4px 14px; border-radius: 16px; }
        .timer-box { font-size: 14px; font-weight: 800; color: #39a084; }
        
        /* 나가기 버튼 스타일 */
        .btn-leave {
            background: #fee2e2;
            color: #ef4444;
            border: 1px solid #fca5a5;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-leave:hover { background: #fca5a5; color: white; }

        .game-body {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100% - 50px);
            overflow: hidden;
        }

        .sidebar { 
            width: 170px; 
            background: #fcfbf8; 
            border-right: 1px solid #ebe6d9; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0;
        }
        .sidebar-title { font-size: 11px; font-weight: 800; color: #888275; margin-bottom: 8px; }
        #player-list { flex: 1; overflow-y: auto; }
        
        .player-card { 
            background: white; padding: 8px 10px; border-radius: 8px; border: 1px solid #e8e3d5; 
            margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600;
        }
        .player-card.drawing { border: 2px solid #f77f5d; background: #fff8f6; }
        
        .host-badge {
            background: #fff8d6;
            color: #d97706;
            border: 1px solid #fef08a;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            margin-right: 4px;
        }

        #btn-start { height: 38px; background: #39a084; border-radius: 8px; font-size: 13px; margin-top: 6px; }

        .canvas-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: #fff;
            position: relative;
        }
        .canvas-wrapper {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
        #canvas { 
            position: absolute;
            top: 0; left: 0;
            width: 100%; 
            height: 100%; 
            background: #fff; 
            touch-action: none; 
            cursor: crosshair; 
        }

        .toolbar { 
            height: 48px; background: #fcfbf8; border-top: 1px solid #ebe6d9; 
            display: flex; align-items: center; padding: 0 8px; gap: 4px; flex-shrink: 0;
            overflow-x: auto;
        }
        .tool-btn { 
            height: 32px; padding: 0 8px; background: #fff; border: 1px solid #dcd7c9; 
            border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; color: #444;
            white-space: nowrap; flex-shrink: 0;
        }
        .tool-btn.active { background: #39a084; color: white; border-color: #39a084; }
        .color-picker { width: 30px; height: 30px; border: 1px solid #dcd7c9; border-radius: 6px; cursor: pointer; flex-shrink: 0; }

        .chat-area { 
            width: 220px; 
            border-left: 1px solid #ebe6d9; 
            background: #fff; 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0;
        }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; font-size: 11px; display: flex; flex-direction: column; gap: 6px; }
        .chat-msg { background: #f4f0e6; padding: 6px 8px; border-radius: 6px; word-break: break-all; }
        .chat-msg.system { background: #feeaa1; font-weight: 700; text-align: center; }
        .chat-msg.correct { background: #39a084; color: white; font-weight: 700; text-align: center; }
        
        .chat-input-box { height: 48px; padding: 6px; border-top: 1px solid #ebe6d9; display: flex; gap: 4px; background: #fcfbf8; flex-shrink: 0; }
        .chat-input-box input { flex: 1; padding: 6px; border: 1px solid #dcd7c9; border-radius: 6px; outline: none; font-size: 11px; }
        .chat-input-box button { height: 34px; padding: 0 8px; background: #39a084; border-radius: 6px; font-size: 12px; }

        .correct-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; justify-content: center; align-items: center; z-index: 100; }
        .correct-overlay.show { display: flex; }
        .correct-banner { background: white; padding: 20px 30px; border-radius: 16px; text-align: center; }

        @media (max-width: 768px) {
            body { padding: 0; }
            #app { height: 100vh; max-height: 100vh; border-radius: 0; border: none; }
            .game-body { flex-direction: column; }
            .sidebar { 
                width: 100%; height: 45px; flex-direction: row; align-items: center; 
                border-right: none; border-bottom: 1px solid #ebe6d9; padding: 4px 8px; 
            }
            .sidebar-title { display: none; }
            #player-list { display: flex; gap: 6px; overflow-x: auto; flex: 1; }
            .player-card { margin-bottom: 0; white-space: nowrap; padding: 4px 8px; }
            #btn-start { height: 32px; margin-top: 0; font-size: 11px; margin-left: 6px; }
            .canvas-area { flex: 1; }
            .chat-area { width: 100%; height: 140px; border-left: none; border-top: 1px solid #ebe6d9; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 로비 화면 -->
    <div id="lobby-screen" class="screen active">
        <div class="brand-header">
            <div class="brand-icon">✏️</div>
            <span>draw.guess</span>
        </div>

        <div class="badge">✨ NO TALENT REQUIRED</div>

        <h1 class="hero-title">
            Make a mark.<br>
            <span class="highlight">Make a mess.</span>
        </h1>

        <p class="hero-desc">
            실시간 그림 퀴즈 게임!<br>
            친구들과 방을 만들고 마음껏 그려보세요.
        </p>

        <div class="tag-group">
            <span class="info-tag">👥 2-8 players</span>
            <span class="info-tag">⏱️ 60s rounds</span>
        </div>

        <div class="lobby-card">
            <div class="tab-group">
                <button class="tab-btn active" id="tab-create">방 만들기</button>
                <button class="tab-btn" id="tab-join">참가하기</button>
            </div>

            <label class="form-label">당신의 닉네임은 무엇인가요?</label>
            <input type="text" id="nickname-input" class="form-input" placeholder="닉네임 입력" maxlength="10">

            <div id="code-input-group" style="display: none;">
                <label class="form-label">참가할 방 코드</label>
                <input type="text" id="roomcode-input" class="form-input" placeholder="6자리 코드" maxlength="6">
            </div>

            <button id="btn-submit" class="submit-btn">방 만들기 →</button>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="screen">
        <header>
            <div class="header-left">
                <div class="room-info">코드: <span id="display-room-code">------</span></div>
                <button class="btn-leave" id="btn-leave">🚪 나가기</button>
            </div>
            <div class="word-box" id="display-word">대기 중...</div>
            <div class="header-right">
                <div class="timer-box" id="display-timer">60초</div>
            </div>
        </header>

        <div class="game-body">
            <div class="sidebar">
                <div class="sidebar-title">PLAYERS</div>
                <div id="player-list"></div>
                <button id="btn-start" class="submit-btn" style="display:none;">게임 시작</button>
            </div>

            <div class="canvas-area">
                <div class="canvas-wrapper" id="canvas-wrapper">
                    <canvas id="canvas"></canvas>
                </div>
                <div class="toolbar">
                    <button class="tool-btn active" id="tool-pen">✏️ 펜</button>
                    <button class="tool-btn" id="tool-bucket">🪣 채우기</button>
                    <input type="color" id="color-picker" class="color-picker" value="#000000">
                    <input type="range" id="line-width" min="2" max="30" value="4" style="width:50px;">
                    <button class="tool-btn" id="btn-undo">↩️</button>
                    <button class="tool-btn" id="btn-redo">↪️</button>
                    <button class="tool-btn" id="btn-clear" style="color:#f77f5d;">지우기</button>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="정답/채팅 입력..." maxlength="50">
                    <button id="btn-send" class="submit-btn">전송</button>
                </div>
            </div>
        </div>

        <div class="correct-overlay" id="correct-overlay">
            <div class="correct-banner">
                <h2 style="color:#39a084; margin-bottom:6px; font-size: 20px;">🎉 정답입니다!</h2>
                <p id="correct-text" style="font-size: 13px; color:#555;"></p>
                <div id="correct-word" style="color:#f77f5d; font-weight:800; margin-top:6px; font-size: 16px;"></div>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const lobbyScreen = document.getElementById('lobby-screen');
    const gameScreen = document.getElementById('game-screen');
    const tabCreate = document.getElementById('tab-create');
    const tabJoin = document.getElementById('tab-join');
    const codeInputGroup = document.getElementById('code-input-group');
    const nicknameInput = document.getElementById('nickname-input');
    const roomcodeInput = document.getElementById('roomcode-input');
    const btnSubmit = document.getElementById('btn-submit');
    const btnLeave = document.getElementById('btn-leave');

    const displayRoomCode = document.getElementById('display-room-code');
    const displayWord = document.getElementById('display-word');
    const displayTimer = document.getElementById('display-timer');
    const playerList = document.getElementById('player-list');
    const btnStart = document.getElementById('btn-start');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');

    const canvasWrapper = document.getElementById('canvas-wrapper');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const toolPen = document.getElementById('tool-pen');
    const toolBucket = document.getElementById('tool-bucket');
    const colorPicker = document.getElementById('color-picker');
    const lineWidthInput = document.getElementById('line-width');
    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    const btnClear = document.getElementById('btn-clear');
    const correctOverlay = document.getElementById('correct-overlay');
    const correctText = document.getElementById('correct-text');
    const correctWord = document.getElementById('correct-word');

    let currentMode = 'create';
    let myNickname = '';
    let isMyTurn = false;
    let isDrawing = false;
    let currentTool = 'pen';
    let canvasHistory = [];
    let historyStep = -1;

    function resizeCanvas() {
        if (!canvasWrapper || canvasWrapper.clientWidth === 0) return;
        const tempImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
        canvas.width = canvasWrapper.clientWidth;
        canvas.height = canvasWrapper.clientHeight;
        ctx.putImageData(tempImage, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);

    tabCreate.addEventListener('click', () => {
        currentMode = 'create';
        tabCreate.classList.add('active');
        tabJoin.classList.remove('active');
        codeInputGroup.style.display = 'none';
        btnSubmit.innerText = '방 만들기 →';
    });

    tabJoin.addEventListener('click', () => {
        currentMode = 'join';
        tabJoin.classList.add('active');
        tabCreate.classList.remove('active');
        codeInputGroup.style.display = 'block';
        btnSubmit.innerText = '참가하기 →';
    });

    btnSubmit.addEventListener('click', () => {
        myNickname = nicknameInput.value.trim();
        if (!myNickname) return alert('닉네임을 입력해주세요.');

        if (currentMode === 'create') {
            socket.emit('createRoom', { userNick: myNickname });
        } else {
            const code = roomcodeInput.value.trim();
            if (!code) return alert('방 코드를 입력해주세요.');
            socket.emit('joinRoom', { roomCode: code, userNick: myNickname });
        }
    });

    // 방 나가기 기능 구현
    btnLeave.addEventListener('click', () => {
        if (confirm('방에서 나가시겠습니까?')) {
            socket.emit('leaveRoom');
            gameScreen.classList.remove('active');
            lobbyScreen.classList.add('active');
            chatMessages.innerHTML = '';
            displayWord.innerText = '대기 중...';
            isMyTurn = false;
        }
    });

    function saveCanvasState() {
        historyStep++;
        if (historyStep < canvasHistory.length) {
            canvasHistory.length = historyStep;
        }
        canvasHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function undo() {
        if (historyStep > 0) {
            historyStep--;
            ctx.putImageData(canvasHistory[historyStep], 0, 0);
            if (isMyTurn) socket.emit('syncCanvasHistory', 'undo');
        }
    }

    function redo() {
        if (historyStep < canvasHistory.length - 1) {
            historyStep++;
            ctx.putImageData(canvasHistory[historyStep], 0, 0);
            if (isMyTurn) socket.emit('syncCanvasHistory', 'redo');
        }
    }

    // 수정된 페인트통 (Flood Fill) 기능
    function floodFill(startX, startY, fillColorHex) {
        const width = canvas.width;
        const height = canvas.height;
        if (startX < 0 || startX >= width || startY < 0 || startY >= height) return;

        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;

        const targetR = parseInt(fillColorHex.slice(1, 3), 16);
        const targetG = parseInt(fillColorHex.slice(3, 5), 16);
        const targetB = parseInt(fillColorHex.slice(5, 7), 16);

        const startPos = (startY * width + startX) * 4;
        const startR = data[startPos];
        const startG = data[startPos + 1];
        const startB = data[startPos + 2];
        const startA = data[startPos + 3];

        if (startR === targetR && startG === targetG && startB === targetB && startA === 255) return;

        const pixelStack = [[startX, startY]];

        while (pixelStack.length > 0) {
            const [x, y] = pixelStack.pop();
            let currentPos = (y * width + x) * 4;

            let curY = y;
            while (curY >= 0 && matchStartColor(currentPos)) {
                curY--;
                currentPos -= width * 4;
            }
            curY++;
            currentPos += width * 4;

            let reachLeft = false;
            let reachRight = false;

            while (curY < height && matchStartColor(currentPos)) {
                colorPixel(currentPos, targetR, targetG, targetB);

                if (x > 0) {
                    if (matchStartColor(currentPos - 4)) {
                        if (!reachLeft) {
                            pixelStack.push([x - 1, curY]);
                            reachLeft = true;
                        }
                    } else if (reachLeft) {
                        reachLeft = false;
                    }
                }

                if (x < width - 1) {
                    if (matchStartColor(currentPos + 4)) {
                        if (!reachRight) {
                            pixelStack.push([x + 1, curY]);
                            reachRight = true;
                        }
                    } else if (reachRight) {
                        reachRight = false;
                    }
                }

                curY++;
                currentPos += width * 4;
            }
        }

        ctx.putImageData(imgData, 0, 0);

        function matchStartColor(pos) {
            return (
                data[pos] === startR &&
                data[pos + 1] === startG &&
                data[pos + 2] === startB &&
                data[pos + 3] === startA
            );
        }

        function colorPixel(pos, r, g, b) {
            data[pos] = r;
            data[pos + 1] = g;
            data[pos + 2] = b;
            data[pos + 3] = 255;
        }
    }

    btnStart.addEventListener('click', () => { socket.emit('startGame'); });

    socket.on('joinSuccess', ({ roomCode, isHost }) => {
        lobbyScreen.classList.remove('active');
        gameScreen.classList.add('active');
        displayRoomCode.innerText = roomCode;
        if (isHost) btnStart.style.display = 'block';
        setTimeout(resizeCanvas, 50);
        saveCanvasState();
    });

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: Math.floor((clientX - rect.left) * (canvas.width / rect.width)),
            y: Math.floor((clientY - rect.top) * (canvas.height / rect.height))
        };
    }

    function startDraw(e) {
        if (!isMyTurn) return;
        const pos = getPos(e);

        if (currentTool === 'bucket') {
            floodFill(pos.x, pos.y, colorPicker.value);
            saveCanvasState();
            socket.emit('draw', { type: 'bucket', x: pos.x, y: pos.y, color: colorPicker.value });
        } else {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            socket.emit('draw', {
                type: 'start',
                x: pos.x, y: pos.y,
                color: colorPicker.value,
                lineWidth: lineWidthInput.value
            });
        }
    }

    function moveDraw(e) {
        if (!isDrawing || !isMyTurn || currentTool !== 'pen') return;
        const pos = getPos(e);

        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = lineWidthInput.value;
        ctx.lineCap = 'round';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();

        socket.emit('draw', { type: 'move', x: pos.x, y: pos.y });
    }

    function endDraw() {
        if (isDrawing) {
            isDrawing = false;
            saveCanvasState();
            socket.emit('draw', { type: 'end' });
        }
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    canvas.addEventListener('mouseup', endDraw);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveDraw(e); }, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    toolPen.addEventListener('click', () => {
        currentTool = 'pen';
        toolPen.classList.add('active');
        toolBucket.classList.remove('active');
    });

    toolBucket.addEventListener('click', () => {
        currentTool = 'bucket';
        toolBucket.classList.add('active');
        toolPen.classList.remove('active');
    });

    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);

    btnClear.addEventListener('click', () => {
        if (!isMyTurn) return;
        socket.emit('clearCanvas');
    });

    function sendMessage() {
        const msg = chatInput.value.trim();
        if (msg) {
            socket.emit('sendMessage', msg);
            chatInput.value = '';
        }
    }
    btnSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    socket.on('updatePlayers', ({ players, hostId }) => {
        playerList.innerHTML = '';
        players.forEach(p => {
            const card = document.createElement('div');
            card.className = `player-card ${p.isDrawing ? 'drawing' : ''}`;
            
            const hostTag = p.id === hostId ? `<span class="host-badge">👑 방장</span>` : '';
            card.innerHTML = `<div style="display:flex; align-items:center;">${hostTag}<span>${p.nickname}</span></div><b style="color:#39a084">${p.score}점</b>`;
            playerList.appendChild(card);
        });
        btnStart.style.display = (socket.id === hostId) ? 'block' : 'none';
    });

    socket.on('turnStart', ({ drawerId, hintMask }) => {
        isMyTurn = (socket.id === drawerId);
        displayWord.innerText = isMyTurn ? '단어 확인 중...' : hintMask;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvasHistory = [];
        historyStep = -1;
        saveCanvasState();
    });

    socket.on('yourWord', (word) => { displayWord.innerText = `제시어: ${word}`; });
    socket.on('timerUpdate', (time) => { displayTimer.innerText = `${time}초`; });

    socket.on('draw', (data) => {
        if (data.type === 'start') {
            ctx.beginPath();
            ctx.strokeStyle = data.color;
            ctx.lineWidth = data.lineWidth;
            ctx.lineCap = 'round';
            ctx.moveTo(data.x, data.y);
        } else if (data.type === 'move') {
            ctx.lineTo(data.x, data.y);
            ctx.stroke();
        } else if (data.type === 'bucket') {
            floodFill(data.x, data.y, data.color);
            saveCanvasState();
        } else if (data.type === 'end') {
            saveCanvasState();
        }
    });

    socket.on('syncCanvasHistory', (action) => {
        if (action === 'undo') undo();
        if (action === 'redo') redo();
    });

    socket.on('clearCanvas', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveCanvasState();
    });

    socket.on('chatMessage', (data) => {
        const msgDiv = document.createElement('div');
        if (data.system) {
            msgDiv.className = 'chat-msg system';
            msgDiv.innerText = data.text;
        } else {
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<b>${data.nickname}:</b> ${data.text}`;
        }
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    socket.on('correctAnswer', ({ winnerNick, word }) => {
        correctText.innerText = `${winnerNick}님이 정답을 맞추셨습니다! (+100점)`;
        correctWord.innerText = `정답: [ ${word} ]`;
        correctOverlay.classList.add('show');
        setTimeout(() => { correctOverlay.classList.remove('show'); }, 2500);
    });

    socket.on('errorMessage', (msg) => { alert(msg); });
</script>
</body>
</html>
