<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch Mind - Catch & Draw</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        #app { width: 1000px; height: 680px; background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .screen { display: none; width: 100%; height: 100%; }
        .screen.active { display: flex; }
        #lobby-screen { flex-direction: column; justify-content: center; align-items: center; gap: 20px; background: linear-gradient(135deg, #6e8efb, #a777e3); color: white; }
        .lobby-card { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 16px; color: #333; width: 360px; text-align: center; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .lobby-card h1 { margin-bottom: 20px; color: #4a4a4a; font-size: 26px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-primary { background: #4e54c8; color: white; }
        .btn-primary:hover { background: #3f43a6; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }

        #game-screen { display: none; flex-direction: column; }
        header { height: 60px; background: #ffffff; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .room-info { font-weight: bold; font-size: 18px; color: #333; }
        .word-box { font-size: 20px; font-weight: 800; color: #ff4757; background: #ffeae6; padding: 6px 16px; border-radius: 20px; }
        .timer-box { font-size: 18px; font-weight: bold; color: #2ed573; min-width: 60px; text-align: right; }

        .main-container { display: flex; flex: 1; height: calc(100% - 60px); }
        
        .sidebar { width: 200px; background: #f8f9fa; border-right: 1px solid #e0e0e0; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .player-card { background: white; padding: 10px 12px; border-radius: 8px; border: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .player-card.drawing { border: 2px solid #ff4757; background: #fff0f0; }
        .player-name { font-weight: bold; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90px; }
        .player-score { font-size: 12px; color: #ff6b81; font-weight: bold; }
        .host-badge { background: #ffa502; color: white; font-size: 10px; padding: 2px 4px; border-radius: 4px; margin-right: 4px; }

        .canvas-area { flex: 1; display: flex; flex-direction: column; background: #eaeaea; position: relative; }
        #canvas { background: white; cursor: crosshair; flex: 1; }
        
        .toolbar { height: 50px; background: #ffffff; border-top: 1px solid #e0e0e0; display: flex; align-items: center; padding: 0 15px; gap: 10px; }
        .tool-btn { padding: 6px 12px; background: #f1f2f6; border: 1px solid #ced6e0; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .tool-btn.active { background: #2ed573; color: white; border-color: #2ed573; }
        .color-picker { width: 30px; height: 30px; border: none; border-radius: 50%; cursor: pointer; padding: 0; background: none; }
        .line-width { width: 80px; }

        .chat-area { width: 260px; background: #ffffff; border-left: 1px solid #e0e0e0; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .chat-msg { background: #f1f2f6; padding: 8px 12px; border-radius: 8px; max-width: 90%; word-break: break-all; }
        .chat-msg.system { background: #eccc68; color: #333; font-weight: bold; align-self: center; text-align: center; width: 100%; max-width: 100%; font-size: 12px; }
        .chat-msg.correct { background: #2ed573; color: white; font-weight: bold; align-self: center; text-align: center; width: 100%; max-width: 100%; font-size: 13px; }
        .chat-msg .sender { font-weight: bold; margin-bottom: 2px; color: #57606f; }
        .chat-input-box { padding: 10px; border-top: 1px solid #e0e0e0; display: flex; gap: 5px; }
        .chat-input-box input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 13px; }

        /* 🎉 정답 모션 팝업 */
        .correct-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(46, 213, 115, 0.2);
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 10;
        }
        .correct-overlay.show { opacity: 1; }
        .correct-banner {
            background: white; padding: 25px 40px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25); text-align: center;
            transform: scale(0.6); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .correct-overlay.show .correct-banner { transform: scale(1.05); }
        .correct-banner h2 { font-size: 28px; color: #2ed573; margin-bottom: 8px; }
        .correct-banner p { font-size: 16px; color: #2f3542; font-weight: bold; }
        .correct-banner .answer-word { color: #ff4757; font-size: 20px; margin-top: 5px; font-weight: 800; }
    </style>
</head>
<body>

<div id="app">
    <!-- 로비 화면 -->
    <div id="lobby-screen" class="screen active">
        <div class="lobby-card">
            <h1>🎨 Catch & Draw</h1>
            <div class="input-group">
                <label>닉네임</label>
                <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요" maxlength="10">
            </div>
            <div class="input-group">
                <label>방 코드 (입장시)</label>
                <input type="text" id="roomcode-input" placeholder="6자리 방 코드" maxlength="6">
            </div>
            <div class="btn-group">
                <button class="btn-primary" id="btn-create">방 만들기</button>
                <button class="btn-secondary" id="btn-join">참가하기</button>
            </div>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="screen">
        <header>
            <div class="room-info">방 코드: <span id="display-room-code" style="color: #4e54c8;">------</span></div>
            <div class="word-box" id="display-word">대기 중...</div>
            <div class="timer-box" id="display-timer">60초</div>
        </header>

        <div class="main-container">
            <div class="sidebar">
                <div style="font-weight: bold; font-size: 14px; color: #666; margin-bottom: 5px;">플레이어</div>
                <div id="player-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
                <button class="btn-primary" id="btn-start" style="margin-top: auto; display: none;">게임 시작</button>
            </div>

            <div class="canvas-area">
                <!-- 정답 오버레이 팝업 -->
                <div class="correct-overlay" id="correct-overlay">
                    <div class="correct-banner">
                        <h2>🎉 정답입니다!</h2>
                        <p id="correct-text">닉네임님이 정답을 맞추셨습니다!</p>
                        <div class="answer-word" id="correct-word">정답: ---</div>
                    </div>
                </div>

                <canvas id="canvas"></canvas>
                
                <div class="toolbar" id="toolbar">
                    <button class="tool-btn active" id="tool-pen">✏️ 펜</button>
                    <button class="tool-btn" id="tool-bucket">🪣 페인트통</button>
                    <input type="color" id="color-picker" class="color-picker" value="#000000">
                    <input type="range" id="line-width" class="line-width" min="2" max="30" value="4">
                    <div style="flex: 1;"></div>
                    <button class="tool-btn" id="btn-undo">↩️ 뒤로</button>
                    <button class="tool-btn" id="btn-redo">↪️ 앞으로</button>
                    <button class="tool-btn" id="btn-clear" style="color: #ff4757;">🗑️ 전체 지우기</button>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="정답 또는 채팅 입력..." maxlength="50">
                    <button class="btn-primary" id="btn-send" style="padding: 8px 12px; flex: none;">전송</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const lobbyScreen = document.getElementById('lobby-screen');
    const gameScreen = document.getElementById('game-screen');
    const nicknameInput = document.getElementById('nickname-input');
    const roomcodeInput = document.getElementById('roomcode-input');
    const btnCreate = document.getElementById('btn-create');
    const btnJoin = document.getElementById('btn-join');
    const displayRoomCode = document.getElementById('display-room-code');
    const displayWord = document.getElementById('display-word');
    const displayTimer = document.getElementById('display-timer');
    const playerList = document.getElementById('player-list');
    const btnStart = document.getElementById('btn-start');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const toolPen = document.getElementById('tool-pen');
    const toolBucket = document.getElementById('tool-bucket');
    const colorPicker = document.getElementById('color-picker');
    const lineWidthInput = document.getElementById('line-width');
    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    const btnClear = document.getElementById('btn-clear');
    const correctOverlay = document.getElementById('correct-overlay');
    const correctText = document.getElementById('correct-text');
    const correctWord = document.getElementById('correct-word');

    let myNickname = '';
    let isMyTurn = false;
    let isDrawing = false;
    let currentTool = 'pen';
    
    // Undo / Redo 히스토리
    let canvasHistory = [];
    let historyStep = -1;

    // 🛠️ 캔버스 크기 조절 (안전성 검사 추가)
    function resizeCanvas() {
        const parent = canvas.parentElement;
        if (!parent) return;

        const rect = parent.getBoundingClientRect();
        const toolbar = document.getElementById('toolbar');
        const toolbarHeight = toolbar ? toolbar.offsetHeight : 50;

        const newWidth = Math.max(1, Math.floor(rect.width));
        const newHeight = Math.max(1, Math.floor(rect.height - toolbarHeight));

        if (newWidth > 0 && newHeight > 0) {
            canvas.width = newWidth;
            canvas.height = newHeight;
            saveCanvasState();
        }
    }
    window.addEventListener('resize', resizeCanvas);

    // 🛠️ 캔버스 상태 저장 (0px 에러 방지 구문 추가)
    function saveCanvasState() {
        if (!canvas.width || !canvas.height || canvas.width <= 0 || canvas.height <= 0) {
            return;
        }

        try {
            historyStep++;
            if (historyStep < canvasHistory.length) {
                canvasHistory.length = historyStep;
            }
            canvasHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        } catch (e) {
            console.warn("Canvas state save skipped:", e);
        }
    }

    function undo() {
        if (historyStep > 0) {
            historyStep--;
            ctx.putImageData(canvasHistory[historyStep], 0, 0);
            if (isMyTurn) socket.emit('syncCanvasHistory', 'undo');
        }
    }

    function redo() {
        if (historyStep < canvasHistory.length - 1) {
            historyStep++;
            ctx.putImageData(canvasHistory[historyStep], 0, 0);
            if (isMyTurn) socket.emit('syncCanvasHistory', 'redo');
        }
    }

    // 🔊 딩동댕 효과음 재생 (웹 오디오 API)
    function playCorrectSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
            
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime + index * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.12 + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(audioCtx.currentTime + index * 0.12);
                osc.stop(audioCtx.currentTime + index * 0.12 + 0.3);
            });
        } catch (e) {
            console.log("Audio Error:", e);
        }
    }

    // 🪣 페인트통(BFS Flood Fill)
    function floodFill(startX, startY, fillColorHex) {
        if (canvas.width <= 0 || canvas.height <= 0) return;

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        const r = parseInt(fillColorHex.slice(1, 3), 16);
        const g = parseInt(fillColorHex.slice(3, 5), 16);
        const b = parseInt(fillColorHex.slice(5, 7), 16);

        const targetPos = (startY * canvas.width + startX) * 4;
        const startR = data[targetPos];
        const startG = data[targetPos + 1];
        const startB = data[targetPos + 2];
        const startA = data[targetPos + 3];

        if (startR === r && startG === g && startB === b) return;

        const queue = [[startX, startY]];
        
        while (queue.length > 0) {
            const [x, y] = queue.pop();
            const pos = (y * canvas.width + x) * 4;

            if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;

            if (data[pos] === startR && data[pos + 1] === startG && data[pos + 2] === startB && data[pos + 3] === startA) {
                data[pos] = r;
                data[pos + 1] = g;
                data[pos + 2] = b;
                data[pos + 3] = 255;

                queue.push([x + 1, y]);
                queue.push([x - 1, y]);
                queue.push([x, y + 1]);
                queue.push([x, y - 1]);
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    // 로비 버튼 이벤트
    btnCreate.addEventListener('click', () => {
        myNickname = nicknameInput.value.trim();
        if (!myNickname) return alert('닉네임을 입력하세요.');
        socket.emit('createRoom', { userNick: myNickname });
    });

    btnJoin.addEventListener('click', () => {
        myNickname = nicknameInput.value.trim();
        const code = roomcodeInput.value.trim();
        if (!myNickname || !code) return alert('닉네임과 방 코드를 입력하세요.');
        socket.emit('joinRoom', { roomCode: code, userNick: myNickname });
    });

    btnStart.addEventListener('click', () => {
        socket.emit('startGame');
    });

    // 마우스 그리기 이벤트
    canvas.addEventListener('mousedown', (e) => {
        if (!isMyTurn) return;

        const rect = canvas.getBoundingClientRect();
        const x = Math.floor(e.clientX - rect.left);
        const y = Math.floor(e.clientY - rect.top);

        if (currentTool === 'bucket') {
            floodFill(x, y, colorPicker.value);
            saveCanvasState();
            socket.emit('draw', { type: 'bucket', x, y, color: colorPicker.value });
        } else {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(x, y);
            socket.emit('draw', {
                type: 'start',
                x, y,
                color: colorPicker.value,
                lineWidth: lineWidthInput.value
            });
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing || !isMyTurn || currentTool !== 'pen') return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = lineWidthInput.value;
        ctx.lineCap = 'round';
        ctx.lineTo(x, y);
        ctx.stroke();

        socket.emit('draw', { type: 'move', x, y });
    });

    canvas.addEventListener('mouseup', () => {
        if (isDrawing) {
            isDrawing = false;
            saveCanvasState();
            socket.emit('draw', { type: 'end' });
        }
    });

    // 툴바 버튼 핸들러
    toolPen.addEventListener('click', () => {
        currentTool = 'pen';
        toolPen.classList.add('active');
        toolBucket.classList.remove('active');
    });

    toolBucket.addEventListener('click', () => {
        currentTool = 'bucket';
        toolBucket.classList.add('active');
        toolPen.classList.remove('active');
    });

    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);

    btnClear.addEventListener('click', () => {
        if (!isMyTurn) return;
        socket.emit('clearCanvas');
    });

    // 채팅 기능
    function sendMessage() {
        const msg = chatInput.value.trim();
        if (msg) {
            socket.emit('sendMessage', msg);
            chatInput.value = '';
        }
    }
    btnSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    // 소켓 수신 핸들러
    socket.on('roomCreated', (code) => {
        displayRoomCode.innerText = code;
    });

    // 🛠️ 방 입장 성공 시 렌더링 안정화 처리
    socket.on('joinSuccess', ({ roomCode, isHost }) => {
        lobbyScreen.classList.remove('active');
        gameScreen.classList.add('active');
        displayRoomCode.innerText = roomCode;
        if (isHost) btnStart.style.display = 'block';

        requestAnimationFrame(() => {
            resizeCanvas();
        });
    });

    socket.on('updatePlayers', ({ players, hostId }) => {
        playerList.innerHTML = '';
        players.forEach(p => {
            const card = document.createElement('div');
            card.className = `player-card ${p.isDrawing ? 'drawing' : ''}`;
            
            const hostBadge = p.id === hostId ? '<span class="host-badge">방장</span>' : '';
            card.innerHTML = `
                <div>${hostBadge}<span class="player-name">${p.nickname}</span></div>
                <div class="player-score">${p.score}점</div>
            `;
            playerList.appendChild(card);
        });

        btnStart.style.display = (socket.id === hostId) ? 'block' : 'none';
    });

    socket.on('turnStart', ({ drawerId, hintMask }) => {
        isMyTurn = (socket.id === drawerId);
        displayWord.innerText = isMyTurn ? '단어 확인 중...' : hintMask;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvasHistory = [];
        historyStep = -1;
        saveCanvasState();
    });

    socket.on('yourWord', (word) => {
        displayWord.innerText = `제시어: ${word}`;
    });

    socket.on('timerUpdate', (time) => {
        displayTimer.innerText = `${time}초`;
    });

    socket.on('draw', (data) => {
        if (data.type === 'start') {
            ctx.beginPath();
            ctx.strokeStyle = data.color;
            ctx.lineWidth = data.lineWidth;
            ctx.lineCap = 'round';
            ctx.moveTo(data.x, data.y);
        } else if (data.type === 'move') {
            ctx.lineTo(data.x, data.y);
            ctx.stroke();
        } else if (data.type === 'bucket') {
            floodFill(data.x, data.y, data.color);
            saveCanvasState();
        } else if (data.type === 'end') {
            saveCanvasState();
        }
    });

    socket.on('syncCanvasHistory', (action) => {
        if (action === 'undo') undo();
        if (action === 'redo') redo();
    });

    socket.on('clearCanvas', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveCanvasState();
    });

    socket.on('chatMessage', (data) => {
        const msgDiv = document.createElement('div');
        if (data.system) {
            msgDiv.className = 'chat-msg system';
            msgDiv.innerText = data.text;
        } else {
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<div class="sender">${data.nickname}</div><div>${data.text}</div>`;
        }
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    // 🎉 정답 공개 및 효과 처리
    socket.on('correctAnswer', ({ winnerNick, word }) => {
        playCorrectSound();
        
        correctText.innerText = `${winnerNick}님이 정답을 맞추셨습니다! (+100점)`;
        correctWord.innerText = `정답: [ ${word} ]`;
        correctOverlay.classList.add('show');

        // 채팅창에도 통보
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg correct';
        msgDiv.innerText = `🎉 [${winnerNick}] 정답! (정답: ${word})`;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        setTimeout(() => {
            correctOverlay.classList.remove('show');
        }, 2500);
    });

    socket.on('errorMessage', (msg) => {
        alert(msg);
    });
</script>
</body>
</html>
