<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Draw, Guess</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; text-align: center; margin: 0; padding: 15px; touch-action: manipulation; }
        .setup-box { background: white; padding: 25px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 30px; width: 90%; max-width: 320px; box-sizing: border-box; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: white; }
        
        .game-layout { display: none; flex-direction: column; align-items: center; gap: 15px; max-width: 1000px; margin: 0 auto; }
        @media (min-width: 768px) {
            .game-layout { flex-direction: row; justify-content: center; align-items: flex-start; }
        }
        
        .left-panel, .right-panel { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 340px; box-sizing: border-box; }
        .center-panel { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; box-sizing: border-box; }
        
        canvas { border: 2px solid #ddd; border-radius: 8px; background: white; cursor: crosshair; touch-action: none; max-width: 100%; height: auto; }
        .chat-logs { height: 200px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; border-radius: 6px; text-align: left; font-size: 14px; margin-bottom: 10px; }
        .system-msg { color: #888; font-style: italic; }
        
        input, button { padding: 8px 12px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .player-item { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        
        /* 그림 도구 스타일 */
        .tools-panel { margin-top: 10px; display: none; flex-direction: column; gap: 10px; align-items: center; background: #f8f9fa; padding: 12px; border-radius: 8px; }
        .tool-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; }
        .color-palette { display: flex; gap: 4px; flex-wrap: wrap; max-width: 280px; justify-content: center; }
        .color-btn { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.3); cursor: pointer; }
        .color-btn.active { transform: scale(1.2); border-color: #333; }
        .mode-btn { background: #6c757d; font-size: 13px; }
        .mode-btn.active { background: #007bff; color: #fff; font-weight: bold; }
        .room-tag { background: #e7f3ff; color: #007bff; padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 16px; display: inline-block; margin-bottom: 10px; }
        
        /* 슬라이더 컨트롤 스타일 */
        .slider-container { display: flex; align-items: center; gap: 8px; background: #fff; padding: 4px 12px; border-radius: 20px; border: 1px solid #ddd; }
        .stroke-slider { -webkit-appearance: none; width: 100px; height: 6px; border-radius: 3px; background: #ddd; outline: none; }
        .stroke-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #007bff; cursor: pointer; }
        .size-preview-dot { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .dot { border-radius: 50%; background-color: #000; display: inline-block; transition: all 0.1s; }
    </style>
</head>
<body>

    <!-- 로비 화면 -->
    <div id="setupBox" class="setup-box">
        <h2>🎨 Draw, Guess</h2>
        
        <div class="tab-buttons">
            <button id="btnTabCreate" class="tab-btn active" onclick="switchTab('create')">방 만들기</button>
            <button id="btnTabJoin" class="tab-btn" onclick="switchTab('join')">방 참가하기</button>
        </div>

        <input type="text" id="userNick" placeholder="닉네임 입력" style="width: 90%; margin-bottom: 15px;"><br>

        <div id="createForm">
            <button onclick="createRoom()" style="width: 98%; padding: 10px; background: #28a745;">새 방 만들기</button>
        </div>

        <div id="joinForm" style="display: none;">
            <input type="text" id="roomCodeInput" placeholder="6자리 방 코드 입력" style="width: 90%; text-transform: uppercase; margin-bottom: 15px;"><br>
            <button onclick="joinRoom()" style="width: 98%; padding: 10px;">방 참가하기</button>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="gameLayout" class="game-layout">
        <div class="left-panel">
            <div class="room-tag">코드: <span id="displayRoomCode"></span> 
                <button onclick="copyCode()" style="padding: 2px 6px; font-size: 11px; margin-left: 4px;">복사</button>
            </div>
            <h3>👥 참가자 목록</h3>
            <div id="playerList"></div>
            <br>
            <button id="btnStartGame" onclick="startGame()" style="width: 100%; background: #28a745; padding: 10px; font-size: 16px;">게임 시작</button>
        </div>

        <div class="center-panel">
            <h2 id="turnInfo">게임 시작 버튼을 눌러주세요</h2>
            <h3>⏱️ 남은 시간: <span id="timer">60</span>초</h3>
            <canvas id="canvas" width="480" height="340"></canvas>
            
            <!-- 그림판 도구 -->
            <div id="controls" class="tools-panel">
                <!-- 색상 선택 -->
                <div class="color-palette" id="palette"></div>
                
                <!-- 도구 및 슬라이더 굵기 조절 -->
                <div class="tool-row">
                    <button id="btnPen" class="mode-btn active" onclick="setPen()">펜 ✏️</button>
                    <button id="btnEraser" class="mode-btn" onclick="setEraser()">지우개 🧹</button>
                    
                    <!-- 굵기 스와이프 슬라이더 -->
                    <div class="slider-container">
                        <input type="range" id="sizeRange" class="stroke-slider" min="1" max="40" value="5" oninput="updateLineWidth(this.value)">
                        <div class="size-preview-dot">
                            <span id="previewDot" class="dot" style="width: 5px; height: 5px;"></span>
                        </div>
                        <span id="sizeText" style="font-size: 12px; color: #555; width: 28px;">5px</span>
                    </div>

                    <button onclick="clearCanvas()" style="background: #dc3545; font-size: 12px; padding: 6px 10px;">전체 지우기 🗑️</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <h3>💬 채팅 & 정답</h3>
            <div id="chatLogs" class="chat-logs"></div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="chatInput" placeholder="정답/채팅 입력" style="flex: 1;" onkeyup="if(window.event.keyCode==13) sendChat()">
                <button onclick="sendChat()">전송</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let isDrawer = false;
        let isDrawing = false;
        let lastPenColor = '#000000';
        let strokeColor = '#000000';
        let lineWidth = 5;
        let isEraser = false;
        let currentRoomCode = '';

        const colors = ['#000000', '#ff0000', '#0000ff', '#008000', '#ffff00', '#ffa500', '#800080', '#ff1493', '#8b4513', '#808080'];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const palette = document.getElementById('palette');
        colors.forEach(color => {
            const btn = document.createElement('button');
            btn.className = 'color-btn';
            btn.style.backgroundColor = color;
            btn.onclick = () => selectColor(color, btn);
            palette.appendChild(btn);
        });

        function switchTab(tab) {
            document.getElementById('btnTabCreate').classList.toggle('active', tab === 'create');
            document.getElementById('btnTabJoin').classList.toggle('active', tab === 'join');
            document.getElementById('createForm').style.display = tab === 'create' ? 'block' : 'none';
            document.getElementById('joinForm').style.display = tab === 'join' ? 'block' : 'none';
        }

        function createRoom() {
            const userNick = document.getElementById('userNick').value.trim();
            if (!userNick) return alert('닉네임을 입력해주세요!');
            socket.emit('createRoom', { userNick });
        }

        function joinRoom() {
            const userNick = document.getElementById('userNick').value.trim();
            const roomCode = document.getElementById('roomCodeInput').value.trim();
            if (!userNick) return alert('닉네임을 입력해주세요!');
            if (!roomCode) return alert('방 코드를 입력해주세요!');
            socket.emit('joinRoom', { roomCode, userNick });
        }

        socket.on('joinSuccess', ({ roomCode, isPlaying }) => {
            currentRoomCode = roomCode;
            document.getElementById('displayRoomCode').innerText = roomCode;
            document.getElementById('setupBox').style.display = 'none';
            document.getElementById('gameLayout').style.display = 'flex';
            
            if (isPlaying) {
                document.getElementById('btnStartGame').style.display = 'none';
            }
        });

        socket.on('errorMessage', (msg) => alert(msg));

        function copyCode() {
            navigator.clipboard.writeText(currentRoomCode);
            alert('방 코드가 복사되었습니다: ' + currentRoomCode);
        }

        function startGame() { 
            socket.emit('startGame'); 
        }

        socket.on('gameStarted', () => {
            document.getElementById('btnStartGame').style.display = 'none';
        });

        socket.on('updatePlayers', (players) => {
            const listDiv = document.getElementById('playerList');
            listDiv.innerHTML = players.map(p => 
                `<div class="player-item"><span>${p.nickname}</span> <strong>${p.score}점</strong></div>`
            ).join('');
        });

        socket.on('turnStart', ({ drawerId, drawerNick, timeLeft }) => {
            isDrawer = (socket.id === drawerId);
            document.getElementById('timer').innerText = timeLeft;
            
            if (isDrawer) {
                document.getElementById('controls').style.display = 'flex';
                setPen();
                selectColor('#000000');
            } else {
                document.getElementById('controls').style.display = 'none';
                document.getElementById('turnInfo').innerText = `🎨 [${drawerNick}]님이 그림을 그리는 중입니다!`;
            }
        });

        socket.on('yourWord', (word) => {
            document.getElementById('turnInfo').innerText = `🎨 당신은 출제자입니다! 제시어: [ ${word} ]`;
        });

        socket.on('timerUpdate', (time) => {
            document.getElementById('timer').innerText = time;
        });

        // 색상 및 슬라이더 조절 함수
        function selectColor(color, btnElem) {
            setPen();
            lastPenColor = color;
            strokeColor = color;
            updatePreviewDot();
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            if (btnElem) btnElem.classList.add('active');
        }

        function setPen() {
            isEraser = false;
            strokeColor = lastPenColor;
            document.getElementById('btnPen').classList.add('active');
            document.getElementById('btnEraser').classList.remove('active');
            updatePreviewDot();
        }

        function setEraser() {
            isEraser = true;
            strokeColor = '#ffffff';
            document.getElementById('btnPen').classList.remove('active');
            document.getElementById('btnEraser').classList.add('active');
            updatePreviewDot();
        }

        function updateLineWidth(val) {
            lineWidth = parseInt(val);
            document.getElementById('sizeText').innerText = val + 'px';
            updatePreviewDot();
        }

        function updatePreviewDot() {
            const dot = document.getElementById('previewDot');
            const size = Math.min(lineWidth, 28); // 미리보기 크기 제한
            dot.style.width = size + 'px';
            dot.style.height = size + 'px';
            dot.style.backgroundColor = isEraser ? '#aaa' : strokeColor; // 지우개일 경우 회색 표시
        }

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!isDrawer) return;
            isDrawing = true;
            const pos = getCanvasPos(e);
            drawAndSend(pos.x, pos.y, 'down');
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawer || !isDrawing) return;
            const pos = getCanvasPos(e);
            drawAndSend(pos.x, pos.y, 'move');
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        canvas.addEventListener('touchstart', (e) => {
            if (!isDrawer) return;
            e.preventDefault();
            isDrawing = true;
            const pos = getCanvasPos(e);
            drawAndSend(pos.x, pos.y, 'down');
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawer || !isDrawing) return;
            e.preventDefault();
            const pos = getCanvasPos(e);
            drawAndSend(pos.x, pos.y, 'move');
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (!isDrawer) return;
            e.preventDefault();
            isDrawing = false;
        }, { passive: false });

        function drawAndSend(x, y, type) {
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = lineWidth;
            if (type === 'down') {
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (type === 'move') {
                ctx.lineTo(x, y);
                ctx.stroke();
            }
            socket.emit('draw', { x, y, type, color: strokeColor, width: lineWidth });
        }

        socket.on('draw', ({ x, y, type, color, width }) => {
            ctx.strokeStyle = color;
            ctx.lineWidth = width || 5;
            if (type === 'down') {
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (type === 'move') {
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        });

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            socket.emit('clearCanvas');
        }

        socket.on('clearCanvas', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function sendChat() {
            const input = document.getElementById('chatInput');
            if (input.value.trim()) {
                socket.emit('sendMessage', input.value.trim());
                input.value = '';
            }
        }

        socket.on('chatMessage', (data) => {
            const logs = document.getElementById('chatLogs');
            const div = document.createElement('div');
            if (data.system) {
                div.className = 'system-msg';
                div.innerText = `[알림] ${data.text}`;
            } else {
                div.innerText = `${data.nickname}: ${data.text}`;
            }
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        });
    </script>
</body>
</html>
