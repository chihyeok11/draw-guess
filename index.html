<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>실시간 멀티 그림 퀴즈</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f2f5; text-align: center; margin: 0; padding: 20px; }
        .setup-box { background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 50px; }
        .game-layout { display: none; justify-content: center; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .left-panel, .right-panel { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .left-panel { width: 200px; text-align: left; }
        .center-panel { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .right-panel { width: 250px; display: flex; flex-direction: column; }
        canvas { border: 2px solid #ddd; border-radius: 8px; background: white; cursor: crosshair; }
        .chat-logs { height: 300px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; border-radius: 6px; text-align: left; font-size: 14px; margin-bottom: 10px; }
        .system-msg { color: #888; font-style: italic; }
        input, button { padding: 8px 12px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .player-item { padding: 6px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .color-btn { width: 25px; height: 25px; border-radius: 50%; border: none; cursor: pointer; margin: 0 2px; }
    </style>
</head>
<body>

    <div id="setupBox" class="setup-box">
        <h2>🎨 실시간 멀티 그림 퀴즈</h2>
        <input type="text" id="userNick" placeholder="닉네임 입력"><br><br>
        <input type="text" id="roomCode" placeholder="방 코드 (예: 1234)" value="1234"><br><br>
        <button onclick="joinRoom()">방 입장하기</button>
    </div>

    <div id="gameLayout" class="game-layout">
        <div class="left-panel">
            <h3>👥 참가자 목록</h3>
            <div id="playerList"></div>
            <br>
            <button onclick="startGame()" style="width: 100%; background: #28a745;">게임 시작</button>
        </div>

        <div class="center-panel">
            <h2 id="turnInfo">게임 시작 버튼을 눌러주세요</h2>
            <h3>⏱️ 남은 시간: <span id="timer">60</span>초</h3>
            <canvas id="canvas" width="480" height="340"></canvas>
            <div id="controls" style="margin-top: 10px; display: none;">
                <button class="color-btn" style="background: black;" onclick="changeColor('black')"></button>
                <button class="color-btn" style="background: red;" onclick="changeColor('red')"></button>
                <button class="color-btn" style="background: blue;" onclick="changeColor('blue')"></button>
                <button class="color-btn" style="background: green;" onclick="changeColor('green')"></button>
                <button onclick="clearCanvas()">전체 지우기</button>
            </div>
        </div>

        <div class="right-panel">
            <h3>💬 채팅 & 정답</h3>
            <div id="chatLogs" class="chat-logs"></div>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="chatInput" placeholder="정답/채팅 입력" style="flex: 1;" onkeyup="if(window.event.keyCode==13) sendChat()">
                <button onclick="sendChat()">전송</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let isDrawer = false;
        let isDrawing = false;
        let strokeColor = 'black';

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        function joinRoom() {
            const userNick = document.getElementById('userNick').value.trim();
            const roomCode = document.getElementById('roomCode').value.trim();

            if (!userNick || !roomCode) {
                alert('닉네임과 방 코드를 입력해주세요!');
                return;
            }

            document.getElementById('setupBox').style.display = 'none';
            document.getElementById('gameLayout').style.display = 'flex';
            socket.emit('joinRoom', { roomCode, userNick });
        }

        function startGame() { socket.emit('startGame'); }

        socket.on('updatePlayers', (players) => {
            const listDiv = document.getElementById('playerList');
            listDiv.innerHTML = players.map(p => 
                `<div class="player-item"><span>${p.nickname}</span> <strong>${p.score}점</strong></div>`
            ).join('');
        });

        socket.on('turnStart', ({ drawerId, drawerNick, timeLeft }) => {
            isDrawer = (socket.id === drawerId);
            document.getElementById('timer').innerText = timeLeft;
            
            if (isDrawer) {
                document.getElementById('controls').style.display = 'block';
            } else {
                document.getElementById('controls').style.display = 'none';
                document.getElementById('turnInfo').innerText = `🎨 [${drawerNick}]님이 그림을 그리는 중입니다!`;
            }
        });

        socket.on('yourWord', (word) => {
            document.getElementById('turnInfo').innerText = `🎨 당신은 출제자입니다! 제시어: [ ${word} ]`;
        });

        socket.on('timerUpdate', (time) => {
            document.getElementById('timer').innerText = time;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!isDrawer) return;
            isDrawing = true;
            drawAndSend(e.offsetX, e.offsetY, 'down');
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawer || !isDrawing) return;
            drawAndSend(e.offsetX, e.offsetY, 'move');
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        function drawAndSend(x, y, type) {
            ctx.strokeStyle = strokeColor;
            if (type === 'down') {
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (type === 'move') {
                ctx.lineTo(x, y);
                ctx.stroke();
            }
            socket.emit('draw', { x, y, type, color: strokeColor });
        }

        socket.on('draw', ({ x, y, type, color }) => {
            ctx.strokeStyle = color;
            if (type === 'down') {
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (type === 'move') {
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        });

        function changeColor(color) { strokeColor = color; }
        
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            socket.emit('clearCanvas');
        }

        socket.on('clearCanvas', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function sendChat() {
            const input = document.getElementById('chatInput');
            if (input.value.trim()) {
                socket.emit('sendMessage', input.value.trim());
                input.value = '';
            }
        }

        socket.on('chatMessage', (data) => {
            const logs = document.getElementById('chatLogs');
            const div = document.createElement('div');
            if (data.system) {
                div.className = 'system-msg';
                div.innerText = `[알림] ${data.text}`;
            } else {
                div.innerText = `${data.nickname}: ${data.text}`;
            }
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        });
    </script>
</body>
</html>
