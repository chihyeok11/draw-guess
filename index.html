<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch Mind - Catch & Draw</title>
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    
    #app { width: 950px; height: 650px; background: #fff; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
    
    .screen { display: none; width: 100%; height: 100%; }
    .screen.active { display: block; }
    
    /* 1. 로비 화면 (중앙 카드 고정) */
    #lobby-screen { background: linear-gradient(135deg, #6e8efb, #a777e3); position: relative; }
    .lobby-box { 
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
        background: white; color: #333; padding: 35px 30px; border-radius: 16px; 
        width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
    }
    .lobby-box h1 { margin-bottom: 25px; color: #4e54c8; font-size: 26px; font-weight: bold; }
    .lobby-box input { 
        width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; 
        border-radius: 8px; outline: none; font-size: 14px; box-sizing: border-box;
    }
    .btn-group { display: flex; gap: 10px; margin-top: 10px; }
    button { 
        flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; 
        font-weight: bold; background: #4e54c8; color: white; font-size: 14px; transition: 0.2s;
    }
    button:hover { background: #3f43a6; }

    /* 2. 게임 화면 */
    #game-screen { position: relative; width: 100%; height: 100%; }
    
    header { 
        height: 50px; background: #fff; border-bottom: 1px solid #eee; 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 0 20px; box-sizing: border-box; 
    }
    .room-info { font-weight: bold; font-size: 15px; }
    .word-box { font-size: 18px; font-weight: bold; color: #ff4757; background: #ffeae6; padding: 4px 16px; border-radius: 20px; }
    .timer-box { font-size: 16px; font-weight: bold; color: #2ed573; }

    /* 사이드바 */
    .sidebar { 
        position: absolute; top: 50px; left: 0; width: 180px; height: 600px; 
        background: #f8f9fa; border-right: 1px solid #eee; padding: 12px; 
        box-sizing: border-box; display: flex; flex-direction: column; 
    }
    #player-list { flex: 1; overflow-y: auto; }
    .player-card { 
        background: white; padding: 8px 10px; border-radius: 6px; border: 1px solid #ddd; 
        margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; 
    }
    .player-card.drawing { border: 2px solid #ff4757; background: #fff0f0; }
    #btn-start { height: 40px; flex: none; font-size: 14px; border-radius: 6px; }

    /* 캔버스 영역 */
    .canvas-area { position: absolute; top: 50px; left: 180px; width: 520px; height: 600px; background: #fff; }
    #canvas { width: 520px; height: 550px; background: #fff; display: block; cursor: crosshair; }
    
    /* 하단 툴바 (높이 및 여백 정렬) */
    .toolbar { 
        height: 50px; background: #fafafa; border-top: 1px solid #eee; 
        display: flex; align-items: center; padding: 0 8px; gap: 6px; box-sizing: border-box; 
    }
    .tool-btn { 
        height: 34px; padding: 0 8px; background: #fff; border: 1px solid #ccc; 
        border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; 
        color: #333; display: flex; align-items: center; justify-content: center; white-space: nowrap;
    }
    .tool-btn.active { background: #2ed573; color: white; border-color: #2ed573; }
    .color-picker { width: 34px; height: 34px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; padding: 0; background: none; }
    .line-width { width: 70px; }

    /* 채팅 영역 */
    .chat-area { 
        position: absolute; top: 50px; left: 700px; width: 250px; height: 600px; 
        border-left: 1px solid #eee; background: #fff; display: flex; flex-direction: column; 
    }
    .chat-messages { flex: 1; padding: 10px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
    .chat-msg { background: #f1f2f6; padding: 6px 10px; border-radius: 6px; word-break: break-all; }
    .chat-msg.system { background: #eccc68; font-weight: bold; text-align: center; }
    .chat-msg.correct { background: #2ed573; color: white; font-weight: bold; text-align: center; }
    .chat-input-box { height: 50px; padding: 8px; border-top: 1px solid #eee; display: flex; gap: 4px; box-sizing: border-box; }
    .chat-input-box input { flex: 1; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 12px; }
    .chat-input-box button { height: 34px; padding: 0 10px; border-radius: 6px; }

    /* 정답 알림 팝업 */
    .correct-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 100; }
    .correct-overlay.show { display: flex; }
    .correct-banner { background: white; color: #333; padding: 20px 35px; border-radius: 12px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
</style>
</head>
<body>

<div id="app">
    <!-- 로비 화면 -->
    <div id="lobby-screen" class="screen active">
        <div class="lobby-card">
            <h1>🎨 Catch & Draw</h1>
            <div class="input-group">
                <label>닉네임</label>
                <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요" maxlength="10">
            </div>
            <div class="input-group">
                <label>방 코드 (입장시)</label>
                <input type="text" id="roomcode-input" placeholder="6자리 방 코드" maxlength="6">
            </div>
            <div class="btn-group">
                <button class="btn-primary" id="btn-create">방 만들기</button>
                <button class="btn-secondary" id="btn-join">참가하기</button>
            </div>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="screen">
        <header>
            <div class="room-info">방 코드: <span id="display-room-code" style="color: #4e54c8;">------</span></div>
            <div class="word-box" id="display-word">대기 중...</div>
            <div class="timer-box" id="display-timer">60초</div>
        </header>

        <div class="main-container">
            <div class="sidebar">
                <div style="font-weight: bold; font-size: 14px; color: #666; margin-bottom: 5px;">플레이어</div>
                <div id="player-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
                <button class="btn-primary" id="btn-start" style="margin-top: auto; display: none;">게임 시작</button>
            </div>

            <div class="canvas-area">
                <div class="correct-overlay" id="correct-overlay">
                    <div class="correct-banner">
                        <h2>🎉 정답입니다!</h2>
                        <p id="correct-text">닉네임님이 정답을 맞추셨습니다!</p>
                        <div class="answer-word" id="correct-word">정답: ---</div>
                    </div>
                </div>

                <canvas id="canvas"></canvas>
                
                <div class="toolbar" id="toolbar">
                    <button class="tool-btn active" id="tool-pen">✏️ 펜</button>
                    <button class="tool-btn" id="tool-bucket">🪣 페인트통</button>
                    <input type="color" id="color-picker" class="color-picker" value="#000000">
                    <input type="range" id="line-width" class="line-width" min="2" max="30" value="4">
                    <div style="flex: 1;"></div>
                    <button class="tool-btn" id="btn-undo">↩️ 뒤로</button>
                    <button class="tool-btn" id="btn-redo">↪️ 앞으로</button>
                    <button class="tool-btn" id="btn-clear" style="color: #ff4757;">🗑️ 전체 지우기</button>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input-box">
                    <input type="text" id="chat-input" placeholder="정답 또는 채팅 입력..." maxlength="50">
                    <button class="btn-primary" id="btn-send" style="padding: 8px 12px; flex: none;">전송</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const lobbyScreen = document.getElementById('lobby-screen');
    const gameScreen = document.getElementById('game-screen');
    const nicknameInput = document.getElementById('nickname-input');
    const roomcodeInput = document.getElementById('roomcode-input');
    const btnCreate = document.getElementById('btn-create');
    const btnJoin = document.getElementById('btn-join');
    const displayRoomCode = document.getElementById('display-room-code');
    const displayWord = document.getElementById('display-word');
    const displayTimer = document.getElementById('display-timer');
    const playerList = document.getElementById('player-list');
    const btnStart = document.getElementById('btn-start');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');

    const canvas = document.getElementById('canvas');
    // 💡 willReadFrequently 경고 해결 옵션 추가
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    const toolPen = document.getElementById('tool-pen');
    const toolBucket = document.getElementById('tool-bucket');
    const colorPicker = document.getElementById('color-picker');
    const lineWidthInput = document.getElementById('line-width');
    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    const btnClear = document.getElementById('btn-clear');
    const correctOverlay = document.getElementById('correct-overlay');
    const correctText = document.getElementById('correct-text');
    const correctWord = document.getElementById('correct-word');

    let myNickname = '';
    let isMyTurn = false;
    let isDrawing = false;
    let currentTool = 'pen';
    
    let canvasHistory = [];
    let historyStep = -1;

    // 🛠️ 안전한 캔버스 크기 계산
    function resizeCanvas() {
        const parent = canvas.parentElement;
        if (!parent) return;

        const rect = parent.getBoundingClientRect();
        const toolbar = document.getElementById('toolbar');
        const toolbarHeight = toolbar ? toolbar.offsetHeight : 50;

        const w = Math.max(100, Math.floor(rect.width));
        const h = Math.max(100, Math.floor(rect.height - toolbarHeight));

        canvas.width = w;
        canvas.height = h;
        saveCanvasState();
    }
    window.addEventListener('resize', resizeCanvas);

    function saveCanvasState() {
        if (!canvas.width || !canvas.height || canvas.width <= 0 || canvas.height <= 0) return;
        try {
            historyStep++;
            if (historyStep < canvasHistory.length) {
                canvasHistory.length = historyStep;
            }
            canvasHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        } catch (e) {
            console.warn("Canvas save bypassed:", e);
        }
    }

    function undo() {
        if (historyStep > 0) {
            historyStep--;
            ctx.putImageData(canvasHistory[historyStep], 0, 0);
            if (isMyTurn) socket.emit('syncCanvasHistory', 'undo');
        }
    }

    function redo() {
        if (historyStep < canvasHistory.length - 1) {
            historyStep++;
            ctx.putImageData(canvasHistory[historyStep], 0, 0);
            if (isMyTurn) socket.emit('syncCanvasHistory', 'redo');
        }
    }

    function playCorrectSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const notes = [523.25, 659.25, 783.99];
            
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime + index * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.12 + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(audioCtx.currentTime + index * 0.12);
                osc.stop(audioCtx.currentTime + index * 0.12 + 0.3);
            });
        } catch (e) {}
    }

    function floodFill(startX, startY, fillColorHex) {
        if (canvas.width <= 0 || canvas.height <= 0) return;

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        const r = parseInt(fillColorHex.slice(1, 3), 16);
        const g = parseInt(fillColorHex.slice(3, 5), 16);
        const b = parseInt(fillColorHex.slice(5, 7), 16);

        const targetPos = (startY * canvas.width + startX) * 4;
        const startR = data[targetPos];
        const startG = data[targetPos + 1];
        const startB = data[targetPos + 2];
        const startA = data[targetPos + 3];

        if (startR === r && startG === g && startB === b) return;

        const queue = [[startX, startY]];
        
        while (queue.length > 0) {
            const [x, y] = queue.pop();
            const pos = (y * canvas.width + x) * 4;

            if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) continue;

            if (data[pos] === startR && data[pos + 1] === startG && data[pos + 2] === startB && data[pos + 3] === startA) {
                data[pos] = r;
                data[pos + 1] = g;
                data[pos + 2] = b;
                data[pos + 3] = 255;

                queue.push([x + 1, y]);
                queue.push([x - 1, y]);
                queue.push([x, y + 1]);
                queue.push([x, y - 1]);
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    btnCreate.addEventListener('click', () => {
        myNickname = nicknameInput.value.trim();
        if (!myNickname) return alert('닉네임을 입력하세요.');
        socket.emit('createRoom', { userNick: myNickname });
    });

    btnJoin.addEventListener('click', () => {
        myNickname = nicknameInput.value.trim();
        const code = roomcodeInput.value.trim();
        if (!myNickname || !code) return alert('닉네임과 방 코드를 입력하세요.');
        socket.emit('joinRoom', { roomCode: code, userNick: myNickname });
    });

    btnStart.addEventListener('click', () => {
        socket.emit('startGame');
    });

    canvas.addEventListener('mousedown', (e) => {
        if (!isMyTurn) return;

        const rect = canvas.getBoundingClientRect();
        const x = Math.floor(e.clientX - rect.left);
        const y = Math.floor(e.clientY - rect.top);

        if (currentTool === 'bucket') {
            floodFill(x, y, colorPicker.value);
            saveCanvasState();
            socket.emit('draw', { type: 'bucket', x, y, color: colorPicker.value });
        } else {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(x, y);
            socket.emit('draw', {
                type: 'start',
                x, y,
                color: colorPicker.value,
                lineWidth: lineWidthInput.value
            });
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing || !isMyTurn || currentTool !== 'pen') return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = lineWidthInput.value;
        ctx.lineCap = 'round';
        ctx.lineTo(x, y);
        ctx.stroke();

        socket.emit('draw', { type: 'move', x, y });
    });

    canvas.addEventListener('mouseup', () => {
        if (isDrawing) {
            isDrawing = false;
            saveCanvasState();
            socket.emit('draw', { type: 'end' });
        }
    });

    toolPen.addEventListener('click', () => {
        currentTool = 'pen';
        toolPen.classList.add('active');
        toolBucket.classList.remove('active');
    });

    toolBucket.addEventListener('click', () => {
        currentTool = 'bucket';
        toolBucket.classList.add('active');
        toolPen.classList.remove('active');
    });

    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);

    btnClear.addEventListener('click', () => {
        if (!isMyTurn) return;
        socket.emit('clearCanvas');
    });

    function sendMessage() {
        const msg = chatInput.value.trim();
        if (msg) {
            socket.emit('sendMessage', msg);
            chatInput.value = '';
        }
    }
    btnSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    socket.on('roomCreated', (code) => {
        displayRoomCode.innerText = code;
    });

    // 🛠️ 확실한 화면 전환 및 렌더링
    socket.on('joinSuccess', ({ roomCode, isHost }) => {
        lobbyScreen.classList.remove('active');
        gameScreen.classList.add('active');
        
        displayRoomCode.innerText = roomCode;
        if (isHost) btnStart.style.display = 'block';

        setTimeout(() => {
            resizeCanvas();
        }, 50);
    });

    socket.on('updatePlayers', ({ players, hostId }) => {
        playerList.innerHTML = '';
        players.forEach(p => {
            const card = document.createElement('div');
            card.className = `player-card ${p.isDrawing ? 'drawing' : ''}`;
            
            const hostBadge = p.id === hostId ? '<span class="host-badge">방장</span>' : '';
            card.innerHTML = `
                <div>${hostBadge}<span class="player-name">${p.nickname}</span></div>
                <div class="player-score">${p.score}점</div>
            `;
            playerList.appendChild(card);
        });

        btnStart.style.display = (socket.id === hostId) ? 'block' : 'none';
    });

    socket.on('turnStart', ({ drawerId, hintMask }) => {
        isMyTurn = (socket.id === drawerId);
        displayWord.innerText = isMyTurn ? '단어 확인 중...' : hintMask;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvasHistory = [];
        historyStep = -1;
        saveCanvasState();
    });

    socket.on('yourWord', (word) => {
        displayWord.innerText = `제시어: ${word}`;
    });

    socket.on('timerUpdate', (time) => {
        displayTimer.innerText = `${time}초`;
    });

    socket.on('draw', (data) => {
        if (data.type === 'start') {
            ctx.beginPath();
            ctx.strokeStyle = data.color;
            ctx.lineWidth = data.lineWidth;
            ctx.lineCap = 'round';
            ctx.moveTo(data.x, data.y);
        } else if (data.type === 'move') {
            ctx.lineTo(data.x, data.y);
            ctx.stroke();
        } else if (data.type === 'bucket') {
            floodFill(data.x, data.y, data.color);
            saveCanvasState();
        } else if (data.type === 'end') {
            saveCanvasState();
        }
    });

    socket.on('syncCanvasHistory', (action) => {
        if (action === 'undo') undo();
        if (action === 'redo') redo();
    });

    socket.on('clearCanvas', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveCanvasState();
    });

    socket.on('chatMessage', (data) => {
        const msgDiv = document.createElement('div');
        if (data.system) {
            msgDiv.className = 'chat-msg system';
            msgDiv.innerText = data.text;
        } else {
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<div class="sender">${data.nickname}</div><div>${data.text}</div>`;
        }
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    socket.on('correctAnswer', ({ winnerNick, word }) => {
        playCorrectSound();
        
        correctText.innerText = `${winnerNick}님이 정답을 맞추셨습니다! (+100점)`;
        correctWord.innerText = `정답: [ ${word} ]`;
        correctOverlay.classList.add('show');

        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg correct';
        msgDiv.innerText = `🎉 [${winnerNick}] 정답! (정답: ${word})`;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        setTimeout(() => {
            correctOverlay.classList.remove('show');
        }, 2500);
    });

    socket.on('errorMessage', (msg) => {
        alert(msg);
    });
</script>
</body>
</html>
